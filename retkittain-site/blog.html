<body>
    <!-- EVÄSTEBANNERI -->
<div id="cookieBanner">
  Tämä sivusto käyttää evästeitä käyttökokemuksen ja sivuston kehittämiseen.
  <button id="acceptCookiesBtn">Hyväksyn</button>
  <button id="rejectCookiesBtn">En hyväksy</button>
</div>

            <nav>

    <main class="container">
        <h1>Uusimmat blogikirjoitukset</h1>
        <div id="blogPosts">Ladataan blogeja...</div>
    </main>

    <script>async function loadBlog() {
            const rssUrl = "https://retkittain.wordpress.com/feed/";
            const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
            const res = await fetch(api);
            const data = await res.json();
            let html = "";
            data.items.slice(0, 5).forEach(post => {
                const text = post.description.replace(/<[^>]*>?/gm, '').substring(0, 200);
                html += `
              <article class="blog-card">
                <h3>${post.title}</h3>
                <small>${new Date(post.pubDate).toLocaleDateString('fi-FI')}</small>
                <p>${text}...</p>
                <a class="button" href="${post.link}" target="_blank">Lue lisää →</a>
              </article>
            `;
            });
            document.getElementById("blogPosts").innerHTML = html;
        }
        loadBlog();</script>

    <footer>© Retkittäin</footer>
    
     <script>
  // Evästebanneri
  const banner = document.getElementById("cookieBanner");
  const acceptBtn = document.getElementById("acceptCookiesBtn");
  const rejectBtn = document.getElementById("rejectCookiesBtn");

  const cookieConsent = localStorage.getItem("retkittainCookieConsent");

  if (cookieConsent === "accepted" || cookieConsent === "rejected") {
    banner.style.display = "none";
  }

  acceptBtn.addEventListener("click", function () {
    localStorage.setItem("retkittainCookieConsent", "accepted");
    banner.style.display = "none";

    if (typeof enableGoogleAnalytics === "function") {
      enableGoogleAnalytics();
    }
  });

  rejectBtn.addEventListener("click", function () {
    localStorage.setItem("retkittainCookieConsent", "rejected");
    banner.style.display = "none";
  });
</script>
    
</body>
</html>
