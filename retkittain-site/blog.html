        <h1>Uusimmat blogikirjoitukset</h1>
        <div id="blogPosts">Ladataan blogeja...</div>
    </main>

    <script>async function loadBlog() {
            const rssUrl = "https://retkittain.wordpress.com/feed/";
            const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(rssUrl);
            const res = await fetch(api);
            const data = await res.json();
            let html = "";
            data.items.slice(0, 5).forEach(post => {
                const text = post.description.replace(/<[^>]*>?/gm, '').substring(0, 200);
                html += `
              <article class="blog-card">
                <h3>${post.title}</h3>
                <small>${new Date(post.pubDate).toLocaleDateString('fi-FI')}</small>
                <p>${text}...</p>
                <a class="button" href="${post.link}" target="_blank">Lue lisää →</a>
              </article>
            `;
            });
            document.getElementById("blogPosts").innerHTML = html;
        }
        loadBlog();</script>

    <script>
  // Mobiilivalikko
  const toggle = document.getElementById('rt-toggle');
  const menu = document.getElementById('rt-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', () => {
      menu.classList.toggle('auki');
      toggle.setAttribute('aria-expanded', menu.classList.contains('auki'));
    });
  }

  // Merkitse aktiivinen linkki automaattisesti
  const nykyinen = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('.rt-nav__links a').forEach(a => {
    const polku = new URL(a.href).pathname.replace(/\/$/, '') || '/';
    if (polku === nykyinen) a.classList.add('aktiivinen');
  });
</script>
